<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tufan Tursu — Nuclear Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#f3e9d2;--gold:#e8c17a;--mono:'Share Tech Mono',monospace;--display:'Syne',sans-serif}
html,body{background:#0b0907;color:var(--paper)}
body{font-family:system-ui,sans-serif}
nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;padding:18px 28px}
nav a{font-family:var(--mono);font-size:13px;color:var(--paper);text-decoration:none;text-shadow:0 1px 8px #000}
nav a:hover{color:var(--gold)}
#hero{position:relative;height:100vh;height:100svh;min-height:540px;overflow:hidden}

/* painting stage: always covers the viewport, keeps the painting's 1200x690 ratio */
.stage{--w:max(100vw,calc(100svh*1.739));position:absolute;left:50%;top:50%;width:var(--w);aspect-ratio:1200/690;
  transform:translate(-50%,-50%);animation:reveal 2.8s cubic-bezier(.2,.6,.2,1) both}
@media(max-aspect-ratio:1/1){.stage{left:calc(50% - .12*var(--w))}}
@keyframes reveal{from{opacity:0;filter:blur(10px) brightness(.3)}to{opacity:1;filter:none}}
.pan{position:absolute;inset:0;will-change:transform;transform:translate3d(calc(var(--px,0)*-16px),calc(var(--py,0)*-10px),0)}
.kb{position:absolute;inset:0;animation:kb 36s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.17) translate(-1.2%,.8%)}}
.kb img{position:absolute;inset:0;width:100%;height:100%;display:block}

/* light falling from the prison window (top left of the painting) */
.beam{position:absolute;inset:0;mix-blend-mode:screen;filter:blur(10px);opacity:.26;
  background:linear-gradient(105deg,rgba(255,226,160,.9),rgba(255,226,160,0) 62%);
  clip-path:polygon(9% 0,19% 0,46% 78%,22% 88%);animation:beam 7s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.14}to{opacity:.34}}
.flicker{position:absolute;inset:0;mix-blend-mode:soft-light;
  background:radial-gradient(circle at 62% 38%,rgba(255,190,110,.55),transparent 55%);animation:flick 3.1s steps(1) infinite}
@keyframes flick{0%{opacity:.7}12%{opacity:.5}23%{opacity:.85}41%{opacity:.6}58%{opacity:.9}74%{opacity:.55}88%{opacity:.8}}

.shade{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,rgba(8,6,4,.88),rgba(8,6,4,.45) 38%,rgba(8,6,4,0) 62%),
  radial-gradient(ellipse at 60% 50%,transparent 45%,rgba(0,0,0,.6))}
#dust{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}

.copy{position:absolute;z-index:4;left:clamp(24px,6vw,90px);bottom:clamp(60px,14vh,130px);max-width:560px}
.tag{font-family:var(--mono);font-size:14px;color:var(--gold);margin-bottom:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,8vw,6.4rem);line-height:.98;letter-spacing:-.02em;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.role{margin-top:18px;font-size:clamp(1.2rem,2vw,1.6rem);font-weight:600;line-height:1.3;color:var(--gold)}
.skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;list-style:none;max-width:520px}
.skills li{font-family:var(--mono);font-size:13px;padding:6px 12px;border:1px solid rgba(232,193,122,.45);background:rgba(8,6,4,.4);backdrop-filter:blur(4px);border-radius:2px}
.copy>*{opacity:0;transform:translateY(18px);animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.tag{animation-delay:1.6s}h1{animation-delay:1.8s}.role{animation-delay:2.2s}.skills{animation-delay:2.5s}
@keyframes rise{to{opacity:1;transform:none}}
.credit{position:absolute;z-index:4;right:22px;bottom:16px;font-family:var(--mono);font-size:11px;color:var(--paper);opacity:.55;text-align:right}

@media(max-width:700px){.shade{background:linear-gradient(0deg,rgba(8,6,4,.9),rgba(8,6,4,.2) 55%,transparent)}.credit{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}.copy>*{opacity:1;transform:none}}
</style>
</head>
<body>
<nav>
  <a href="#hero">// tufan.tursu</a>
  <a href="mailto:tufantrs@outlook.com">tufantrs@outlook.com</a>
</nav>

<section id="hero">
  <div class="stage">
    <div class="pan" id="pan">
      <div class="kb">
        <img src="socrates.webp" alt="The Death of Socrates, oil painting by Jacques-Louis David" width="1200" height="690" fetchpriority="high">
        <div class="beam"></div>
        <div class="flicker"></div>
      </div>
    </div>
  </div>
  <div class="shade"></div>
  <canvas id="dust"></canvas>

  <div class="copy">
    <p class="tag">Open to opportunities</p>
    <h1>Tufan<br>Tursu</h1>
    <p class="role">Nuclear Engineer</p>
    <ul class="skills">
      <li>Thermal Engineering</li>
      <li>CFD Analysis</li>
      <li>3D Mechanical Design Engineering</li>
      <li>Analytical Engineering</li>
    </ul>
  </div>
  <p class="credit">The Death of Socrates<br>Jacques-Louis David, 1787</p>
</section>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hero = document.getElementById('hero'), pan = document.getElementById('pan');

  /* mouse parallax, eased */
  var tx=0, ty=0, cx=0, cy=0;
  if(!reduce){
    hero.addEventListener('pointermove', function(e){
      var r = hero.getBoundingClientRect();
      tx = (e.clientX - r.left)/r.width - .5;
      ty = (e.clientY - r.top)/r.height - .5;
    });
  }

  /* drifting dust, warm and sparse */
  var cv = document.getElementById('dust'), ctx = cv.getContext('2d'), W, H, dpr, P = [];
  function size(){
    dpr = Math.min(devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function seed(){
    P = [];
    var n = Math.round(Math.min(90, W/14));
    for(var i=0;i<n;i++) P.push({
      x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+.4,
      vx:(Math.random()-.3)*.12, vy:-(Math.random()*.18+.04),
      a:Math.random()*.5+.15, t:Math.random()*6.28
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p = P[i];
      p.x += p.vx; p.y += p.vy; p.t += .015;
      if(p.y < -5){p.y = H+5; p.x = Math.random()*W}
      if(p.x > W+5) p.x = -5; if(p.x < -5) p.x = W+5;
      ctx.globalAlpha = p.a*(.55+.45*Math.sin(p.t));
      ctx.fillStyle = '#ffe3a8';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    }
  }
  size(); seed();
  addEventListener('resize', function(){size(); seed(); if(reduce) draw();});

  function loop(){
    cx += (tx-cx)*.05; cy += (ty-cy)*.05;
    pan.style.setProperty('--px', cx.toFixed(4));
    pan.style.setProperty('--py', cy.toFixed(4));
    draw();
    requestAnimationFrame(loop);
  }
  if(reduce) draw(); else loop();
})();
</script>
</body>
</html>
